name: Deploy Admin to GitHub Pages

# Public GitHub Pages deployment for the TukangNDeso admin panel.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL, including /v1"
        required: false
        type: string
  pull_request:
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin-pages.yml"
  push:
    branches:
      - master
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL || 'https://geje.tech/v1' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: admin
        run: npm install

      - name: Build static admin
        working-directory: admin
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin/out

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
