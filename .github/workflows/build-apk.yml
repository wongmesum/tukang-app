name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL, without /v1"
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'http://10.0.2.2:3000' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when missing
        working-directory: app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name tukangndeso .
          fi

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: app
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Give artifact a clear name
        run: cp app/build/app/outputs/flutter-apk/app-release.apk TukangNDeso-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukangNDeso-APK
          path: TukangNDeso-release.apk
          if-no-files-found: error
          retention-days: 14
