name: Validate Wasmer API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/validate-wasmer.yml"
  push:
    branches:
      - "chore/wasmer-edge-migration"
    paths:
      - "api/**"
      - ".github/workflows/validate-wasmer.yml"

permissions:
  contents: read

concurrency:
  group: wasmer-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and smoke-test stateless API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Type-check API
        working-directory: api
        run: bun run lint

      - name: Run API tests
        working-directory: api
        run: bun run test

      - name: Build Wasmer entrypoint
        working-directory: api
        run: bun run build:wasmer

      - name: Smoke-test stateless health endpoint
        working-directory: api
        env:
          NODE_ENV: test
          DEPLOYMENT_TARGET: wasmer
          REPOSITORY_MODE: memory
          REDIS_DRIVER: none
          REDIS_REQUIRED: "false"
          BACKGROUND_JOBS_ENABLED: "false"
          PORT: "8787"
        run: |
          node dist/wasmer/server.cjs > /tmp/tukangndeso-wasmer.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8787/health
          grep --fixed-strings '"deployment_target":"wasmer"' /tmp/health.json


  r2-staging-smoke:
    name: Smoke-test staging R2 upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload a tiny PNG and verify its public URL
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://tukang-app.wasmer.app"

          auth_json="$(curl --fail --silent --show-error "$api_base/dev/admin-token")"
          token="$(jq -er '.data.token' <<<"$auth_json")"

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > /tmp/r2-smoke.png

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -F "file=@/tmp/r2-smoke.png;type=image/png" \
            "$api_base/v1/upload/image" > /tmp/upload.json

          jq -e '.success == true and .data.storage == "r2" and (.data.url | startswith("https://"))' /tmp/upload.json > /dev/null
          public_url="$(jq -er '.data.url' /tmp/upload.json)"
          object_key="$(jq -er '.data.object_key' /tmp/upload.json)"

          curl --fail --silent --show-error --output /dev/null "$public_url"

          {
            echo "R2 staging smoke test passed."
            echo
            echo "- Storage: r2"
            echo "- Object key: `$object_key`"
            echo "- Public URL: $public_url"
          } >> "$GITHUB_STEP_SUMMARY"
