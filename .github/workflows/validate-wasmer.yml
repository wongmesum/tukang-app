name: Validate Wasmer API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/validate-wasmer.yml"
  push:
    branches:
      - "chore/wasmer-edge-migration"
    paths:
      - "api/**"
      - ".github/workflows/validate-wasmer.yml"

permissions:
  contents: read

concurrency:
  group: wasmer-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and smoke-test stateless API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Type-check API
        working-directory: api
        run: bun run lint

      - name: Run API tests
        working-directory: api
        run: bun run test

      - name: Build Wasmer entrypoint
        working-directory: api
        run: bun run build:wasmer

      - name: Smoke-test stateless health endpoint
        working-directory: api
        env:
          NODE_ENV: test
          DEPLOYMENT_TARGET: wasmer
          REPOSITORY_MODE: memory
          REDIS_DRIVER: none
          REDIS_REQUIRED: "false"
          BACKGROUND_JOBS_ENABLED: "false"
          PORT: "8787"
        run: |
          node dist/wasmer/server.cjs > /tmp/tukangndeso-wasmer.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:8787/health
          grep --fixed-strings '"deployment_target":"wasmer"' /tmp/health.json


  production-staging-health:
    name: Verify production-mode staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify health and disabled dev endpoint
        shell: bash
        run: |
          set -euo pipefail
          api_base="https://tukang-app.wasmer.app"

          curl --fail --silent --show-error "$api_base/health" > /tmp/health.json
          jq -e '
            .success == true and
            .data.status == "ok" and
            .data.db_status == "connected" and
            .data.redis_status == "connected" and
            .data.deployment_target == "wasmer"
          ' /tmp/health.json > /dev/null

          dev_status="$(curl --silent --output /dev/null --write-out "%{http_code}" "$api_base/dev/admin-token")"
          test "$dev_status" = "404"

          {
            echo "Production-mode staging verification passed."
            echo
            echo "- Health: ok"
            echo "- Database: connected"
            echo "- Redis: connected"
            echo "- Deployment target: wasmer"
            echo "- Dev admin endpoint: disabled (404)"
          } >> "$GITHUB_STEP_SUMMARY"
