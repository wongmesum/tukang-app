name: CI — Lint, Test, Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tukangndeso_test
  JWT_SECRET: ci-test-secret-tukangndeso-32chars-min
  QRIS_WEBHOOK_SECRET: ci-test-webhook-secret

jobs:
  # --- Backend: lint + test + build ---
  api:
    name: API — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: tukangndeso_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: TypeScript lint (type check)
        working-directory: api
        run: bun run lint

      - name: Run database migrations
        working-directory: api
        run: bunx prisma db push --skip-generate

      - name: Generate Prisma client
        working-directory: api
        run: bunx prisma generate

      - name: Run tests
        working-directory: api
        run: bun test

  # --- Admin panel: build ---
  admin:
    name: Admin — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build
        working-directory: admin
        run: npm run build

  # --- Docker: build images ---
  docker:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [api, admin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: tukangndeso-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: false
          tags: tukangndeso-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
