version: "3.8"

services:
  # PostgreSQL + PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tukangndeso-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tukangndeso}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tukangndeso}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/prisma/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./api/prisma/002_phase3_production_fields.sql:/docker-entrypoint-initdb.d/002_phase3.sql
      - ./api/prisma/003_chat_messages.sql:/docker-entrypoint-initdb.d/003_chat.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tukangndeso}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: tukangndeso-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tukangndeso-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-tukangndeso}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tukangndeso}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      OTP_EXPIRY_SECONDS: 300
      OTP_MAX_ATTEMPTS: 5
      CORS_ORIGINS: ${CORS_ORIGINS}
      QRIS_WEBHOOK_SECRET: ${QRIS_WEBHOOK_SECRET}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      FONNTE_API_TOKEN: ${FONNTE_API_TOKEN}
      CDN_BASE_URL: ${CDN_BASE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tukangndeso-nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/www:/var/www/html:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  uploads:
