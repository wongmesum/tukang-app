worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream API
    upstream api_backend {
        server api:3000;
    }

    # HTTP → redirect to HTTPS (uncomment when SSL is ready)
    # server {
    #     listen 80;
    #     server_name api.tukangndeso.id tukangndeso.id;
    #     return 301 https://$host$request_uri;
    # }

    # Main server (HTTP for now, switch to HTTPS when certs are ready)
    server {
        listen 80;
        server_name api.tukangndeso.id localhost;

        # SSL (uncomment when certs are ready)
        # listen 443 ssl http2;
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;

        # Health check for load balancer
        location = /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
        }

        # API endpoints
        location /v1/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /v1/realtime {
            proxy_pass http://api_backend/v1/realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Dev endpoints (disabled in production)
        location /dev/ {
            proxy_pass http://api_backend/dev/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static uploads
        location /uploads/ {
            proxy_pass http://api_backend/uploads/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # QRIS Webhook (no rate limit — called by payment provider)
        location = /v1/payments/webhook/qris {
            proxy_pass http://api_backend/v1/payments/webhook/qris;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Website public (if self-hosted, otherwise use Vercel)
    server {
        listen 80;
        server_name tukangndeso.id www.tukangndeso.id;

        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
